name: Update Publications

on:
  schedule:
    # Runs at 00:00 UTC every Sunday
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows you to run this manually from the Actions tab

permissions:
  contents: write # Required for git-auto-commit-action to push changes

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scholarly

      - name: Run Scholar scraper
        run: python scripts/download_pubs.py

      - name: Commit and push new publications
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generate new publications from Google Scholar"
          file_pattern: _publications/*.md
